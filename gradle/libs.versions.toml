[versions]
agp = "9.4.1"
kotlin = "2.2.10"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
material = "1.10.0"
activityCompose = "1.13.0"
